<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ML Ransomware Detection Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            color: white;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
            text-align: center;
            transition: transform 0.3s ease;
            position: relative;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .stat-number {
            font-size: 2.5em;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .stat-label {
            color: #666;
            font-size: 1.1em;
        }

        .stat-sublabel {
            color: #999;
            font-size: 0.85em;
            margin-top: 5px;
            font-style: italic;
        }

        .malware { color: #e74c3c; }
        .benign { color: #27ae60; }
        .total { color: #3498db; }
        .confidence { color: #f39c12; }
        .whitelist { color: #f39c12; }

        .whitelist-indicator {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #f39c12;
            color: white;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.7em;
            font-weight: bold;
        }

        .content-grid {
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 30px;
            margin-top: 30px;
        }

        .main-content {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }

        .sidebar {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
            max-height: 600px;
            overflow-y: auto;
        }

        .section-title {
            font-size: 1.5em;
            margin-bottom: 20px;
            color: #333;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .process-list {
            list-style: none;
        }

        .process-item {
            background: #f8f9fa;
            margin-bottom: 10px;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            transition: all 0.3s ease;
        }

        .process-item:hover {
            transform: translateX(5px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .process-header {
            padding: 15px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            transition: background-color 0.3s ease;
        }

        .process-header:hover {
            background: #f0f2ff;
        }

        .process-info {
            flex-grow: 1;
        }

        .process-id {
            font-weight: bold;
            font-size: 1.1em;
            margin-bottom: 5px;
        }

        .process-meta {
            font-size: 0.9em;
            color: #666;
        }

        .process-status {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: bold;
            text-transform: uppercase;
        }

        .status-malware {
            background: #ffe6e6;
            color: #d63031;
        }

        .status-benign {
            background: #e6f7e6;
            color: #00b894;
        }

        .expand-icon {
            transition: transform 0.3s ease;
            font-size: 1.2em;
            color: #667eea;
        }

        .expanded .expand-icon {
            transform: rotate(180deg);
        }

        .process-details {
            padding: 20px;
            background: #f8f9fa;
            border-top: 1px solid #e9ecef;
            display: none;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                max-height: 0;
            }
            to {
                opacity: 1;
                max-height: 500px;
            }
        }

        .detail-section {
            margin-bottom: 15px;
        }

        .detail-title {
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
            font-size: 0.95em;
        }

        .detail-content {
            background: white;
            padding: 10px;
            border-radius: 6px;
            border-left: 3px solid #667eea;
            font-size: 0.9em;
        }

        .features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
            margin-top: 10px;
        }

        .feature-item {
            background: white;
            padding: 8px;
            border-radius: 4px;
            border-left: 3px solid #ddd;
            font-size: 0.85em;
        }

        .feature-positive {
            border-left-color: #e74c3c;
            background: #fdf2f2;
        }

        .feature-negative {
            border-left-color: #27ae60;
            background: #f2fdf2;
        }

        .loading {
            text-align: center;
            padding: 50px;
            color: #666;
        }

        .error {
            background: #ffe6e6;
            color: #d63031;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            border-left: 4px solid #d63031;
        }

        .refresh-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            margin-bottom: 20px;
            transition: transform 0.2s ease;
        }

        .refresh-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        .chart-container {
            height: 300px;
            margin: 20px 0;
        }

        .event-types {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
        }

        .event-type-badge {
            background: #e9ecef;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.75em;
            color: #495057;
        }

        .prediction-history {
            max-height: 200px;
            overflow-y: auto;
        }

        .prediction-entry {
            padding: 8px;
            border-bottom: 1px solid #eee;
            font-size: 0.85em;
        }

        .prediction-entry:last-child {
            border-bottom: none;
        }

        .confidence-bar {
            width: 100%;
            height: 4px;
            background: #e9ecef;
            border-radius: 2px;
            margin-top: 5px;
            overflow: hidden;
        }

        .confidence-fill {
            height: 100%;
            border-radius: 2px;
            transition: width 0.3s ease;
        }

        .menu-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            background: white;
            border-radius: 10px;
            margin: 25px auto 30px auto;
            max-width: 900px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.07);
            padding: 12px 0;
        }

        .menu-item {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.1em;
            padding: 8px 22px;
            border-radius: 6px;
            transition: background 0.2s, color 0.2s;
            position: relative;
        }

        .menu-item:hover:not(.active) {
            background: #f0f2ff;
            color: #4f6bed;
        }

        .menu-item.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.13);
        }

        .whitelist-alert {
            background: #fff3cd;
            border: 1px solid #ffeaa7;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #856404;
        }

        .whitelist-alert .icon {
            font-size: 1.2em;
        }

        .whitelist-summary {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
            border-left: 4px solid #f39c12;
        }

        .whitelist-summary h4 {
            color: #f39c12;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .whitelist-summary p {
            color: #666;
            font-size: 0.9em;
            margin: 0;
        }

        @media (max-width: 768px) {
            .content-grid {
                grid-template-columns: 1fr;
            }
            
            .stats-grid {
                grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            }
            
            .container {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Menu Bar Start -->
        <nav class="menu-bar">
            <a href="#" class="menu-item active">Dynamic</a>
            <a href="/static" class="menu-item">Static</a>
            <a href="/network" class="menu-item">Network</a>
            <a href="/whitelist" class="menu-item">Whitelist</a>
            <a href="/risk-predictor" class="menu-item">Risk Predictor</a>
        </nav>
        <!-- Menu Bar End -->

        <div class="header">
            <h1>🛡️ ML Ransomware Detection Dashboard</h1>
            <p>Real-time monitoring of process behavior analysis with intelligent whitelisting</p>
        </div>


        <div class="stats-grid" id="statsGrid">
            <!-- Stats cards will be populated by JavaScript -->
        </div>

        <div class="content-grid">
            <div class="main-content">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                    <h2 class="section-title">System Overview</h2>
                    <button class="refresh-btn" onclick="refreshData()">🔄 Refresh</button>
                </div>
                
                <div class="chart-container">
                    <canvas id="hourlyChart"></canvas>
                </div>
                
                <div id="systemStatus" class="loading">
                    Loading system status...
                </div>

                <!-- Whitelist Summary -->
                <div id="whitelistSummary" class="whitelist-summary" style="display: none;">
                    <h4>🛡️ Whitelist Summary</h4>
                    <p id="whitelistSummaryText">Loading whitelist information...</p>
                </div>
            </div>

            <div class="sidebar">
                <h3 class="section-title">Recent Processes</h3>
                <ul class="process-list" id="processList">
                    <!-- Process items will be populated by JavaScript -->
                </ul>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <script>
        let chart;
        let currentData = null;
        let whitelistStats = null;

        // Initialize the dashboard
        document.addEventListener('DOMContentLoaded', function() {
            refreshData();
            loadWhitelistStats();
            // Auto-refresh every 300 seconds
            setInterval(refreshData, 300000);
        });

        async function refreshData() {
            try {
                const response = await fetch('/dashboard/data');
                const data = await response.json();
                
                if (data.status === 'success') {
                    currentData = data;
                    updateStats(data.stats);
                    updateProcessList(data.recent_predictions);
                    updateChart(data.hourly_stats);
                    updateSystemStatus();
                } else {
                    showError('Failed to load dashboard data');
                }
            } catch (error) {
                console.error('Error fetching dashboard data:', error);
                showError('Connection error: ' + error.message);
            }
        }

        async function loadWhitelistStats() {
            try {
                // Get whitelist statistics
                const whitelistResponse = await fetch('/stats');
                const statsData = await whitelistResponse.json();
                
                if (statsData.status === 'success') {
                    whitelistStats = statsData.whitelist_stats;
                    updateWhitelistInfo();
                }

            } catch (error) {
                console.error('Error loading whitelist stats:', error);
            }
        }


        function updateWhitelistInfo() {
            if (!whitelistStats) return;
            
            const summaryDiv = document.getElementById('whitelistSummary');
            const summaryText = document.getElementById('whitelistSummaryText');
            
            const whitelistedCount = whitelistStats.whitelisted_malware_count || 0;
            
            if (whitelistedCount > 0) {
                summaryText.textContent = `${whitelistedCount} unique process${whitelistedCount > 1 ? 'es' : ''} on whitelist were classified as malware and excluded from dashboard counts. These are likely false positives.`;
                summaryDiv.style.display = 'block';
            }
        }

        function updateStats(stats) {
            const statsGrid = document.getElementById('statsGrid');
            
            const malwarePercentage = stats.malware_percentage ? stats.malware_percentage.toFixed(1) : '0.0';
            const avgConfidence = stats.avg_confidence ? (stats.avg_confidence * 100).toFixed(1) : '0.0';
            
            // Calculate actual totals including whitelisted
            const actualTotal = stats.total_unique_processes || 0;
            const whitelistedMalware = whitelistStats ? (whitelistStats.whitelisted_malware_count || 0) : 0;
            const displayedTotal = actualTotal - whitelistedMalware;
            
            statsGrid.innerHTML = `
                <div class="stat-card" onclick="viewProcesses('all')">
                    <div class="stat-number total">${displayedTotal}</div>
                    <div class="stat-label">Unique Processes</div>
                    <div class="stat-sublabel">Excluding ${whitelistedMalware} whitelisted</div>
                    ${whitelistedMalware > 0 ? '<div class="whitelist-indicator">🛡️ Filtered</div>' : ''}
                </div>
                <div class="stat-card" onclick="viewProcesses('malware')">
                    <div class="stat-number malware">${stats.unique_malware_count || 0}</div>
                    <div class="stat-label">Ransomware Detected</div>
                    <div class="stat-sublabel">Non-whitelisted threats</div>
                </div>
                <div class="stat-card" onclick="viewProcesses('benign')">
                    <div class="stat-number benign">${stats.unique_benign_count || 0}</div>
                    <div class="stat-label">Benign Processes</div>
                    <div class="stat-sublabel">Including whitelisted</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number confidence">${avgConfidence}%</div>
                    <div class="stat-label">Avg Confidence</div>
                    <div class="stat-sublabel">All predictions</div>
                </div>
                ${whitelistedMalware > 0 ? `
                <div class="stat-card" onclick="viewProcesses('whitelisted_alerts')">
                    <div class="stat-number whitelist">${whitelistedMalware}</div>
                    <div class="stat-label">Whitelist Alerts</div>
                    <div class="stat-sublabel">False positives</div>
                    <div class="whitelist-indicator">🛡️ Review</div>
                </div>
                ` : ''}
            `;
        }

        function viewProcesses(filter) {
            // Redirect to processes page with filter
            window.location.href = `/processes?filter=${filter}`;
        }

        function updateProcessList(processes) {
            const processList = document.getElementById('processList');
            
            if (!processes || processes.length === 0) {
                processList.innerHTML = '<li style="text-align: center; color: #666; padding: 20px;">No processes found</li>';
                return;
            }

            processList.innerHTML = processes.map(process => {
                // Skip whitelisted malware from main list
                if (process.is_whitelisted && process.prediction === 'malware') {
                    return '';
                }

                return `
                <li class="process-item" data-process-id="${process.process_id}">
                    <div class="process-header" onclick="toggleProcessDetails('${process.process_id}')">
                        <div class="process-info">
                            <div class="process-id">PID: ${process.process_id}</div>
                            <div class="process-meta">
                                ${process.app_name || 'Unknown'} | 
                                ${process.hostname ? `Host: ${process.hostname} | ` : ''}
                                Confidence: ${(process.confidence * 100).toFixed(1)}%
                            </div>
                        </div>
                        <div class="process-status ${process.prediction === 'malware' ? 'status-malware' : 'status-benign'}">
                            ${process.prediction}
                        </div>
                        <div class="expand-icon">▼</div>
                    </div>
                    <div class="process-details" id="details-${process.process_id}">
                        <div class="loading">Loading details...</div>
                    </div>
                </li>
                `;
            }).filter(item => item !== '').join('');
        }

        async function toggleProcessDetails(processId) {
            const processItem = document.querySelector(`[data-process-id="${processId}"]`);
            const detailsDiv = document.getElementById(`details-${processId}`);
            
            if (processItem.classList.contains('expanded')) {
                // Collapse
                processItem.classList.remove('expanded');
                detailsDiv.style.display = 'none';
                return;
            }

            // Expand
            processItem.classList.add('expanded');
            detailsDiv.style.display = 'block';
            
            try {
                const response = await fetch(`/process/${processId}/details`);
                const data = await response.json();
                
                if (data.status === 'success') {
                    displayProcessDetails(detailsDiv, data);
                } else {
                    detailsDiv.innerHTML = '<div class="error">Failed to load process details</div>';
                }
            } catch (error) {
                console.error('Error fetching process details:', error);
                detailsDiv.innerHTML = '<div class="error">Connection error</div>';
            }
        }

        function displayProcessDetails(container, data) {
            const summary = data.summary;
            const predictions = data.predictions;
            
            container.innerHTML = `
                <div class="detail-section">
                    <div class="detail-title">📊 Process Summary</div>
                    <div class="detail-content">
                        <strong>Total Predictions:</strong> ${summary.total_predictions}<br>
                        <strong>Ransomware:</strong> ${summary.malware_predictions} | 
                        <strong>Benign:</strong> ${summary.benign_predictions}<br>
                        <strong>Average Confidence:</strong> ${(summary.avg_confidence * 100).toFixed(1)}%<br>
                        <strong>First Seen:</strong> ${new Date(summary.first_seen).toLocaleString()}<br>
                        <strong>Last Seen:</strong> ${new Date(summary.last_seen).toLocaleString()}
                        ${summary.is_whitelisted ? '<br><strong style="color: #f39c12;">🛡️ Whitelisted Process</strong>' : ''}
                    </div>
                </div>

                <div class="detail-section">
                    <div class="detail-title">🏷️ Event Types</div>
                    <div class="detail-content">
                        <div class="event-types">
                            ${summary.unique_event_types.map(type => 
                                `<span class="event-type-badge">${type}</span>`
                            ).join('')}
                        </div>
                    </div>
                </div>

                <div class="detail-section">
                    <div class="detail-title">📈 Recent Predictions</div>
                    <div class="detail-content">
                        <div class="prediction-history">
                            ${predictions.slice(0, 10).map(pred => `
                                <div class="prediction-entry">
                                    <div style="display: flex; justify-content: space-between; align-items: center;">
                                        <span class="process-status ${pred.prediction === 'malware' ? 'status-malware' : 'status-benign'}">
                                            ${pred.prediction}
                                        </span>
                                        <span style="font-size: 0.8em; color: #666;">
                                            ${new Date(pred.created_at).toLocaleString()}
                                        </span>
                                    </div>
                                    <div class="confidence-bar">
                                        <div class="confidence-fill ${pred.prediction === 'malware' ? 'malware' : 'benign'}" 
                                             style="width: ${pred.confidence * 100}%; background-color: ${pred.prediction === 'malware' ? '#e74c3c' : '#27ae60'};"></div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>

                ${predictions[0] && predictions[0].feature_explanations ? `
                <div class="detail-section">
                    <div class="detail-title">🔍 Latest Feature Analysis</div>
                    <div class="detail-content">
                        <div class="features-grid">
                            ${predictions[0].feature_explanations.slice(0, 6).map(feature => `
                                <div class="feature-item ${feature.contribution > 0 ? 'feature-positive' : 'feature-negative'}">
                                    <strong>${feature.feature_name}</strong><br>
                                    Value: ${feature.feature_value.toFixed(3)}<br>
                                    Impact: ${feature.contribution.toFixed(3)} (${feature.direction})
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
                ` : ''}

                <div class="detail-section">
                    <div class="detail-title">📁 Process Information</div>
                    <div class="detail-content">
                        <strong>Path:</strong> ${predictions[0].path || 'Unknown'}<br>
                        <strong>Parent PID:</strong> ${predictions[0].parent_pid || 'Unknown'}<br>
                        <strong>Parent Name:</strong> ${predictions[0].parent_name || 'Unknown'}<br>
                        <strong>Events Count:</strong> ${predictions[0].num_events || 0}
                    </div>
                </div>
            `;
        }

        function updateChart(hourlyStats) {
            const ctx = document.getElementById('hourlyChart').getContext('2d');
            
            if (chart) {
                chart.destroy();
            }

            const labels = hourlyStats.map(stat => stat.hour);
            const malwareData = hourlyStats.map(stat => stat.unique_malware || 0);
            const totalData = hourlyStats.map(stat => stat.total_unique || 0);

            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: 'Total Unique Processes (Filtered)',
                            data: totalData,
                            borderColor: '#3498db',
                            backgroundColor: 'rgba(52, 152, 219, 0.1)',
                            fill: true,
                            tension: 0.4
                        },
                        {
                            label: 'Unique Ransomware Processes',
                            data: malwareData,
                            borderColor: '#e74c3c',
                            backgroundColor: 'rgba(231, 76, 60, 0.1)',
                            fill: true,
                            tension: 0.4
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        title: {
                            display: true,
                            text: 'Hourly Process Activity (Last 24 Hours) - Whitelisted Excluded',
                            font: {
                                size: 16
                            }
                        },
                        legend: {
                            position: 'top'
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            title: {
                                display: true,
                                text: 'Number of Unique Processes'
                            }
                        },
                        x: {
                            title: {
                                display: true,
                                text: 'Hour'
                            }
                        }
                    }
                }
            });
        }

        function updateSystemStatus() {
            const statusDiv = document.getElementById('systemStatus');
            if (currentData && currentData.stats) {
                const stats = currentData.stats;
                const lastUpdate = stats.last_prediction ? 
                    new Date(stats.last_prediction).toLocaleString() : 'Never';
                
                const whitelistedCount = whitelistStats ? (whitelistStats.whitelisted_malware_count || 0) : 0;
                
                statusDiv.innerHTML = `
                    <div style="background: white; padding: 20px; border-radius: 10px; border-left: 4px solid #27ae60;">
                        <h4 style="color: #27ae60; margin-bottom: 10px;">🟢 System Online</h4>
                        <p><strong>Last Activity:</strong> ${lastUpdate}</p>
                        <p><strong>Database Status:</strong> Connected and operational</p>
                        <p><strong>ML Model:</strong> Active and processing</p>
                        <p><strong>Whitelist System:</strong> ${whitelistedCount > 0 ? `Active (${whitelistedCount} filtered)` : 'Active'}</p>
                    </div>
                `;
            }
        }

        function showError(message) {
            const statusDiv = document.getElementById('systemStatus');
            statusDiv.innerHTML = `<div class="error">⚠️ ${message}</div>`;
        }
    </script>
</body>
</html>
