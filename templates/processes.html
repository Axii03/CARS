<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Process Listings - ML Malware Detection</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .header-left h1 {
            font-size: 2em;
            color: #333;
            margin-bottom: 5px;
        }

        .header-left .subtitle {
            color: #666;
            font-size: 1.1em;
        }

        .header-controls {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .filter-tabs {
            display: flex;
            background: #f8f9fa;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #e9ecef;
        }

        .filter-tab {
            padding: 12px 20px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s ease;
            color: #666;
            font-weight: 500;
            position: relative;
        }

        .filter-tab.active {
            background: #667eea;
            color: white;
        }

        .filter-tab:hover:not(.active) {
            background: #e9ecef;
            color: #333;
        }

        .filter-tab.has-alerts::after {
            content: '';
            position: absolute;
            top: 5px;
            right: 5px;
            width: 8px;
            height: 8px;
            background: #e74c3c;
            border-radius: 50%;
            border: 2px solid white;
        }

        .back-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: transform 0.2s ease;
        }

        .back-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        .processes-container {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }

        .processes-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f8f9fa;
        }

        .processes-title {
            font-size: 1.5em;
            color: #333;
        }

        .process-count {
            background: #f8f9fa;
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: bold;
            color: #667eea;
        }

        .processes-grid {
            display: grid;
            gap: 15px;
        }

        .process-card {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            transition: all 0.3s ease;
            border-left: 4px solid transparent;
        }

        .process-card:hover {
            transform: translateX(5px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            background: white;
        }

        .process-card.malware {
            border-left-color: #e74c3c;
        }

        .process-card.benign {
            border-left-color: #27ae60;
        }

        .process-card.whitelisted {
            border-left-color: #f39c12;
            background: #fff8f0;
        }

        .process-card.whitelisted:hover {
            background: #fff5e6;
        }

        .process-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
        }

        .process-main-info {
            flex-grow: 1;
        }

        .process-id {
            font-size: 1.3em;
            font-weight: bold;
            margin-bottom: 5px;
            color: #333;
        }

        .process-name {
            font-size: 1.1em;
            color: #667eea;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .process-path {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 10px;
            word-break: break-all;
        }

        .process-status {
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: bold;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .status-malware {
            background: #ffe6e6;
            color: #d63031;
        }

        .status-benign {
            background: #e6f7e6;
            color: #00b894;
        }

        .status-whitelisted {
            background: #fff3cd;
            color: #856404;
        }

        .whitelist-indicator {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: #fff3cd;
            color: #856404;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.8em;
            font-weight: bold;
            margin-top: 8px;
        }

        .process-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .detail-item {
            background: white;
            padding: 12px;
            border-radius: 8px;
            border-left: 3px solid #667eea;
        }

        .process-card.whitelisted .detail-item {
            border-left-color: #f39c12;
        }

        .detail-label {
            font-size: 0.8em;
            color: #666;
            text-transform: uppercase;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .detail-value {
            font-size: 1em;
            color: #333;
            font-weight: 500;
        }

        .confidence-bar {
            width: 100%;
            height: 6px;
            background: #e9ecef;
            border-radius: 3px;
            margin-top: 8px;
            overflow: hidden;
        }

        .confidence-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.3s ease;
        }

        .expand-btn {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9em;
            color: #667eea;
            transition: all 0.3s ease;
            margin-top: 15px;
        }

        .expand-btn:hover {
            background: #667eea;
            color: white;
        }

        .process-expanded {
            margin-top: 20px;
            padding: 20px;
            background: white;
            border-radius: 10px;
            border: 1px solid #e9ecef;
            display: none;
        }

        .whitelist-alert-banner {
            background: linear-gradient(135deg, #ff9f43 0%, #ff6348 100%);
            color: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 500;
        }

        .whitelist-alert-banner .icon {
            font-size: 1.5em;
        }

        .whitelist-info {
            background: #fff3cd;
            border: 1px solid #ffeaa7;
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
        }

        .whitelist-info h4 {
            color: #856404;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .whitelist-info p {
            color: #6c5400;
            font-size: 0.9em;
            line-height: 1.4;
        }

        .loading {
            text-align: center;
            padding: 50px;
            color: #666;
            font-size: 1.2em;
        }

        .error {
            background: #ffe6e6;
            color: #d63031;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            border-left: 4px solid #d63031;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }

        .empty-state h3 {
            font-size: 1.5em;
            margin-bottom: 10px;
            color: #999;
        }

        .alert-summary {
            background: #ffe6e6;
            border: 1px solid #ff9999;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            color: #d63031;
        }

        .alert-summary .icon {
            font-size: 1.2em;
            margin-right: 8px;
        }

        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                text-align: center;
            }
            
            .header-controls {
                flex-direction: column;
                width: 100%;
            }
            
            .filter-tabs {
                width: 100%;
            }
            
            .filter-tab {
                flex: 1;
                font-size: 0.9em;
            }
            
            .processes-header {
                flex-direction: column;
                gap: 15px;
            }
            
            .process-header {
                flex-direction: column;
                gap: 15px;
            }
            
            .process-details {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-left">
                <h1>🔍 Process Analysis</h1>
                <div class="subtitle" id="filterTitle">Loading processes...</div>
            </div>
            <div class="header-controls">
                <div class="filter-tabs">
                    <button class="filter-tab" data-filter="all">All Processes</button>
                    <button class="filter-tab" data-filter="malware">Malware</button>
                    <button class="filter-tab" data-filter="benign">Benign</button>
                    <button class="filter-tab" data-filter="whitelisted_alerts" id="whitelistTab">Whitelist Alerts</button>
                </div>
                <a href="/" class="back-btn">
                    ← Back to Dashboard
                </a>
            </div>
        </div>

        <div class="processes-container">
            <div class="processes-header">
                <h2 class="processes-title" id="processesTitle">All Processes</h2>
                <div class="process-count" id="processCount">0 processes</div>
            </div>

            <!-- Alert banner for whitelisted alerts -->
            <div id="whitelistBanner" class="whitelist-alert-banner" style="display: none;">
                <span class="icon">⚠️</span>
                <div>
                    <strong>Whitelisted Application Alerts</strong><br>
                    These processes were classified as malware but are on your whitelist. They're excluded from main dashboard counts but shown here for review.
                </div>
            </div>

            <div id="processesContent" class="loading">
                Loading processes...
            </div>
        </div>
    </div>

    <script>
        let currentFilter = 'all';
        let processesData = [];
        let whitelistAlertCount = 0;

        // Initialize page
        document.addEventListener('DOMContentLoaded', function() {
            // Get filter from URL params
            const urlParams = new URLSearchParams(window.location.search);
            currentFilter = urlParams.get('filter') || 'all';
            
            // Set active tab
            document.querySelectorAll('.filter-tab').forEach(tab => {
                if (tab.dataset.filter === currentFilter) {
                    tab.classList.add('active');
                }
                
                tab.addEventListener('click', function() {
                    switchFilter(this.dataset.filter);
                });
            });

            loadProcesses();
            checkWhitelistAlerts();
        });

        function switchFilter(filter) {
            currentFilter = filter;
            
            // Update URL
            const url = new URL(window.location);
            url.searchParams.set('filter', filter);
            window.history.pushState({}, '', url);
            
            // Update active tab
            document.querySelectorAll('.filter-tab').forEach(tab => {
                tab.classList.remove('active');
                if (tab.dataset.filter === filter) {
                    tab.classList.add('active');
                }
            });

            // Show/hide whitelist banner
            const banner = document.getElementById('whitelistBanner');
            if (filter === 'whitelisted_alerts') {
                banner.style.display = 'flex';
            } else {
                banner.style.display = 'none';
            }

            loadProcesses();
        }

        async function checkWhitelistAlerts() {
            try {
                const response = await fetch('/api/processes?filter=whitelisted_alerts&limit=1');
                const data = await response.json();
                
                if (data.status === 'success' && data.count > 0) {
                    whitelistAlertCount = data.count;
                    const whitelistTab = document.getElementById('whitelistTab');
                    whitelistTab.classList.add('has-alerts');
                    whitelistTab.title = `${data.count} whitelisted alerts`;
                }
            } catch (error) {
                console.error('Error checking whitelist alerts:', error);
            }
        }

        async function loadProcesses() {
            const contentDiv = document.getElementById('processesContent');
            contentDiv.innerHTML = '<div class="loading">Loading processes...</div>';

            try {
                const response = await fetch(`/api/processes?filter=${currentFilter}&limit=200`);
                const data = await response.json();

                if (data.status === 'success') {
                    processesData = data.processes;
                    updatePageTitle(data.filter, data.count);
                    renderProcesses(data.processes);
                } else {
                    showError('Failed to load processes');
                }
            } catch (error) {
                console.error('Error loading processes:', error);
                showError('Connection error: ' + error.message);
            }
        }

        function updatePageTitle(filter, count) {
            const titles = {
                'all': 'All Processes',
                'malware': 'Malware Processes',
                'benign': 'Benign Processes',
                'whitelisted_alerts': 'Whitelisted Application Alerts'
            };

            const subtitles = {
                'all': 'Complete list of all analyzed processes (excluding whitelisted malware)',
                'malware': 'Processes identified as potentially malicious (non-whitelisted)',
                'benign': 'Processes identified as safe and legitimate',
                'whitelisted_alerts': 'Whitelisted processes that were classified as malware'
            };

            document.getElementById('filterTitle').textContent = subtitles[filter];
            document.getElementById('processesTitle').textContent = titles[filter];
            document.getElementById('processCount').textContent = `${count} processes`;
        }

        function renderProcesses(processes) {
            const contentDiv = document.getElementById('processesContent');

            if (!processes || processes.length === 0) {
                let emptyMessage = 'No processes found';
                let emptyDescription = `No ${currentFilter === 'all' ? '' : currentFilter} processes match the current filter.`;
                
                if (currentFilter === 'whitelisted_alerts') {
                    emptyMessage = 'No Whitelisted Alerts';
                    emptyDescription = 'No whitelisted processes have been classified as malware. This is good news!';
                }

                contentDiv.innerHTML = `
                    <div class="empty-state">
                        <h3>${emptyMessage}</h3>
                        <p>${emptyDescription}</p>
                    </div>
                `;
                return;
            }

            const processesGrid = document.createElement('div');
            processesGrid.className = 'processes-grid';

            processes.forEach(process => {
                const processCard = createProcessCard(process);
                processesGrid.appendChild(processCard);
            });

            // Clear content and add elements based on filter
            contentDiv.innerHTML = '';

            // Show summary for whitelisted alerts
            if (currentFilter === 'whitelisted_alerts') {
                const alertSummary = document.createElement('div');
                alertSummary.className = 'alert-summary';
                alertSummary.innerHTML = `
                    <span class="icon">🛡️</span>
                    <strong>Found ${processes.length} whitelisted processes classified as malware.</strong>
                    These are likely false positives due to your whitelist configuration. Review them to ensure they're legitimate.
                `;
                contentDiv.appendChild(alertSummary);
            }

            contentDiv.appendChild(processesGrid);
        }

        function createProcessCard(process) {
            const card = document.createElement('div');
            const isWhitelisted = currentFilter === 'whitelisted_alerts' || process.is_whitelisted;
            const cardClass = isWhitelisted ? 'whitelisted' : process.prediction;
            
            card.className = `process-card ${cardClass}`;

            const confidencePercentage = (process.confidence * 100).toFixed(1);
            const createdAt = new Date(process.created_at).toLocaleString();

            // Determine status display
            let statusClass, statusText;
            if (isWhitelisted) {
                statusClass = 'status-whitelisted';
                statusText = 'Whitelisted';
            } else {
                statusClass = process.prediction === 'malware' ? 'status-malware' : 'status-benign';
                statusText = process.prediction;
            }

            card.innerHTML = `
                <div class="process-header">
                    <div class="process-main-info">
                        <div class="process-id">Process ID: ${process.process_id}</div>
                        <div class="process-name">${process.app_name || 'Unknown Application'}</div>
                        <div class="process-hostname" style="font-size: 0.9em; color: #999; margin-bottom: 5px;">
                            ${process.hostname ? `🖥️ Host: ${process.hostname}` : ''}
                        </div>
                        <div class="process-path">${process.path || 'Path unknown'}</div>
                        ${isWhitelisted ? '<div class="whitelist-indicator">🛡️ Whitelisted Application</div>' : ''}
                    </div>
                    <div class="process-status ${statusClass}">
                        ${statusText}
                    </div>
                </div>

                <div class="process-details">
                    <div class="detail-item">
                        <div class="detail-label">Confidence</div>
                        <div class="detail-value">${confidencePercentage}%</div>
                        <div class="confidence-bar">
                            <div class="confidence-fill" style="width: ${confidencePercentage}%; background-color: ${isWhitelisted ? '#f39c12' : (process.prediction === 'malware' ? '#e74c3c' : '#27ae60')};"></div>
                        </div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Last Seen</div>
                        <div class="detail-value">${createdAt}</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Parent Process</div>
                        <div class="detail-value">${process.parent_name || 'Unknown'}</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Events</div>
                        <div class="detail-value">${process.num_events || 0}</div>
                    </div>
                </div>

                ${isWhitelisted ? `
                    <div class="whitelist-info">
                        <h4>🛡️ Whitelist Information</h4>
                        <p>This process is on your whitelist but was classified as malware with ${confidencePercentage}% confidence. 
                        It's excluded from main dashboard counts but shown here for your review. Ensure this is a legitimate application.</p>
                    </div>
                ` : ''}

                <button class="expand-btn" onclick="toggleProcessDetails('${process.process_id}', this)">
                    🔍 View Full Analysis
                </button>

                <div class="process-expanded" id="expanded-${process.process_id}">
                    <div class="loading">Loading detailed analysis...</div>
                </div>
            `;

            return card;
        }

        async function toggleProcessDetails(processId, button) {
            const expandedDiv = document.getElementById(`expanded-${processId}`);
            
            if (expandedDiv.style.display === 'block') {
                // Collapse
                expandedDiv.style.display = 'none';
                button.textContent = '🔍 View Full Analysis';
                return;
            }

            // Expand
            expandedDiv.style.display = 'block';
            button.textContent = '📁 Hide Analysis';

            try {
                const response = await fetch(`/process/${processId}/details`);
                const data = await response.json();

                if (data.status === 'success') {
                    renderProcessDetails(expandedDiv, data);
                } else {
                    expandedDiv.innerHTML = '<div class="error">Failed to load process details</div>';
                }
            } catch (error) {
                console.error('Error fetching process details:', error);
                expandedDiv.innerHTML = '<div class="error">Connection error</div>';
            }
        }

        function renderProcessDetails(container, data) {
            const summary = data.summary;
            const predictions = data.predictions;
            const isWhitelisted = summary.is_whitelisted;

            container.innerHTML = `
                <h4 style="margin-bottom: 20px; color: #333;">📊 Detailed Analysis for Process ${data.process_id}</h4>
                
                ${isWhitelisted ? `
                    <div style="background: #fff3cd; border: 1px solid #ffeaa7; border-radius: 8px; padding: 15px; margin-bottom: 20px;">
                        <h5 style="color: #856404; margin-bottom: 10px; display: flex; align-items: center; gap: 8px;">
                            🛡️ Whitelisted Process Alert
                        </h5>
                        <p style="color: #6c5400; font-size: 0.9em; line-height: 1.4;">
                            This process is whitelisted but has ${summary.malware_predictions} malware classification(s) out of ${summary.total_predictions} total predictions. 
                            Average confidence: ${(summary.avg_confidence * 100).toFixed(1)}%. Please verify this is a legitimate application.
                        </p>
                    </div>
                ` : ''}
                
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 25px;">
                    <div class="detail-item">
                        <div class="detail-label">Total Predictions</div>
                        <div class="detail-value">${summary.total_predictions}</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Malware Classifications</div>
                        <div class="detail-value" style="color: #e74c3c;">${summary.malware_predictions}</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Benign Classifications</div>
                        <div class="detail-value" style="color: #27ae60;">${summary.benign_predictions}</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Average Confidence</div>
                        <div class="detail-value">${(summary.avg_confidence * 100).toFixed(1)}%</div>
                    </div>
                </div>

                <div style="margin-bottom: 25px;">
                    <h5 style="margin-bottom: 15px; color: #333;">🏷️ Detected Event Types</h5>
                    <div style="display: flex; flex-wrap: wrap; gap: 8px;">
                        ${summary.unique_event_types.map(type => 
                            `<span style="background: #f8f9fa; padding: 4px 12px; border-radius: 15px; font-size: 0.85em; color: #495057; border: 1px solid #dee2e6;">${type}</span>`
                        ).join('')}
                    </div>
                </div>

                <div style="margin-bottom: 25px;">
                    <h5 style="margin-bottom: 15px; color: #333;">📈 Recent Predictions Timeline</h5>
                    <div style="max-height: 300px; overflow-y: auto;">
                        ${predictions.slice(0, 15).map(pred => {
                            const predictionColor = pred.prediction === 'malware' ? (isWhitelisted ? '#f39c12' : '#e74c3c') : '#27ae60';
                            const bgColor = pred.prediction === 'malware' ? (isWhitelisted ? '#fff8f0' : '#fff5f5') : '#f0fff4';
                            return `
                            <div style="display: flex; justify-content: space-between; align-items: center; padding: 12px; margin-bottom: 8px; background: ${bgColor}; border-radius: 8px; border-left: 4px solid ${predictionColor};">
                                <div>
                                    <span class="process-status ${pred.prediction === 'malware' ? (isWhitelisted ? 'status-whitelisted' : 'status-malware') : 'status-benign'}" style="margin-right: 15px;">
                                        ${isWhitelisted && pred.prediction === 'malware' ? 'Whitelisted' : pred.prediction}
                                    </span>
                                    <span style="font-size: 0.9em; color: #666;">
                                        Confidence: ${(pred.confidence * 100).toFixed(1)}%
                                    </span>
                                </div>
                                <span style="font-size: 0.85em; color: #666;">
                                    ${new Date(pred.created_at).toLocaleString()}
                                </span>
                            </div>
                            `;
                        }).join('')}
                    </div>
                </div>

                ${predictions[0] && predictions[0].feature_explanations ? `
                <div style="margin-bottom: 20px;">
                    <h5 style="margin-bottom: 15px; color: #333;">🔍 Key Feature Analysis (Latest Prediction)</h5>
                    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px;">
                        ${predictions[0].feature_explanations.slice(0, 6).map(feature => `
                            <div style="background: ${feature.contribution > 0 ? '#fff5f5' : '#f0fff4'}; padding: 15px; border-radius: 8px; border-left: 4px solid ${feature.contribution > 0 ? '#e74c3c' : '#27ae60'};">
                                <div style="font-weight: bold; margin-bottom: 8px; color: #333;">${feature.feature_name}</div>
                                <div style="font-size: 0.9em; color: #666; margin-bottom: 5px;">Value: ${feature.feature_value.toFixed(3)}</div>
                                <div style="font-size: 0.85em; color: ${feature.contribution > 0 ? '#d63031' : '#00b894'};">
                                    Impact: ${feature.contribution.toFixed(3)} (${feature.direction} risk)
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
                ` : ''}

                <div>
                    <h5 style="margin-bottom: 15px; color: #333;">📁 Process Metadata</h5>
                    <div style="background: #f8f9fa; padding: 15px; border-radius: 8px; font-family: monospace; font-size: 0.9em;">
                        <div style="margin-bottom: 8px;"><strong>Full Path:</strong> ${predictions[0].path || 'Unknown'}</div>
                        <div style="margin-bottom: 8px;"><strong>Parent PID:</strong> ${predictions[0].parent_pid || 'Unknown'}</div>
                        <div style="margin-bottom: 8px;"><strong>Parent Process:</strong> ${predictions[0].parent_name || 'Unknown'}</div>
                        <div style="margin-bottom: 8px;"><strong>Parent Application:</strong> ${predictions[0].parent_app || 'Unknown'}</div>
                        <div style="margin-bottom: 8px;"><strong>Total Events:</strong> ${predictions[0].num_events || 0}</div>
                        <div style="margin-bottom: 8px;"><strong>Hostname:</strong> ${predictions[0].hostname || 'Unknown'}</div>
                        ${isWhitelisted ? '<div style="color: #856404;"><strong>Whitelist Status:</strong> ✅ Active</div>' : ''}
                    </div>
                </div>
            `;
        }

        function showError(message) {
            const contentDiv = document.getElementById('processesContent');
            contentDiv.innerHTML = `<div class="error">⚠️ ${message}</div>`;
        }
    </script>
</body>
</html>
