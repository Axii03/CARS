<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>RRS Security Scanner</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f7f7f7;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 600px;
            margin: 60px auto;
            background: #fff;
            padding: 32px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #333;
        }
        input[type="text"] {
            width: 80%;
            padding: 10px;
            font-size: 1em;
            border: 1px solid #ccc;
            border-radius: 4px;
            margin-right: 8px;
        }
        button {
            padding: 10px 18px;
            font-size: 1em;
            background: #007bff;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:disabled {
            background: #aaa;
        }
        .result {
            margin-top: 32px;
            background: #f1f1f1;
            padding: 16px;
            border-radius: 4px;
            white-space: pre-wrap;
            font-family: monospace;
        }
        .error {
            color: #d00;
            margin-top: 16px;
        }
        .input-box {
            display: flex;
            justify-content: center;
            margin-bottom: 16px;
        }
        .input-box input {
            flex: 1;
            margin-right: 8px;
        }
        .results {
            margin-top: 16px;
        }
        .chart-container {
            margin-top: 32px;
        }
        .export-buttons {
            margin-top: 16px;
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Ransomware Risk Score Scanner</h1>
        <div class="input-box">
            <input type="text" id="domain" placeholder="Enter domain (e.g. example.com)">
            <button onclick="scan()">Scan</button>
        </div>
        <div class="results" id="results-container"></div>
        <div class="raw-json-section" style="margin-top:24px;">
            <h2>Raw JSON Output</h2>
            <pre id="raw-json-output" style="background:#f1f1f1; padding:12px; border-radius:4px; max-height:300px; overflow:auto;"></pre>
        </div>
        <div class="chart-container">
            <canvas id="riskChart"></canvas>
        </div>
        <div class="export-buttons">
            <button onclick="exportJson()">Export JSON</button>
            <button onclick="exportCsv()">Export CSV</button>
        </div>
        <div id="modal-root"></div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="/static/script.js"></script>
</body>
</html>
